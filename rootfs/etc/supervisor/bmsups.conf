[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autostart=%(ENV_BT_ENABLED)s
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bluetoothd]
command=/bin/bash -c "sleep 2; exec /usr/libexec/bluetooth/bluetoothd -n"
autostart=%(ENV_BT_ENABLED)s
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nut-raw]
command=/usr/local/bin/run-driver.sh usbhid-ups %(ENV_UPS_RAW_NAME)s
priority=30
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:upsd]
command=/usr/sbin/upsd -F -u root
priority=40
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bridge]
command=/usr/bin/python3 -u /app/bridge.py
priority=50
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nut-virtual]
command=/usr/local/bin/run-driver.sh dummy-ups %(ENV_UPS_NAME)s %(ENV_VIRTUAL_DEV_PATH)s
priority=60
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
